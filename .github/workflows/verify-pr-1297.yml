name: Verify RH PR 1297
on:
  push:
    branches: [codex/verify-1297-9282]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RH_BASE: 9282d3a102c4aff0e6026746db2a8990f5d9cddd
      RH_HEAD: f6ec5d8dce24c33fc08a49c037618497405ebc0d
      MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
    steps:
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/riemann-hypothesis
          ref: 9282d3a102c4aff0e6026746db2a8990f5d9cddd
          persist-credentials: false
      - name: Free space on the hosted runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/swift
          df -h .
      - name: Install Lean through elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the upstream Lean build cache
        run: |
          test "$(git rev-parse HEAD)" = "$RH_BASE"
          lake exe mathlib/cache get
          lake exe cache get
          df -h .
      - name: Apply the exact PR commit
        run: |
          git fetch --depth=2 origin refs/pull/1297/head
          test "$(git rev-parse FETCH_HEAD)" = "$RH_HEAD"
          git show --format= --binary "$RH_HEAD" | git apply --index
          git diff --cached --check
          git diff --cached --stat
      - name: Build Lean and all downstream modules
        run: lake build
